<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIL Player</title>
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--ink-2); margin-bottom: 20px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer;
    user-select: none;
  }
  .card:hover { border-color: var(--accent); }
  .card .top { display: flex; align-items: center; justify-content: space-between; }
  .card .name { font-weight: 600; font-size: 15px; }
  .card .what { color: var(--ink-2); font-size: 12.5px; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span {
    position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s;
  }
  .switch span::after {
    content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px;
    border-radius: 50%; background: #fff; transition: .15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  section { margin-top: 28px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin: 0 0 8px; }
  .status { font-family: var(--mono); font-size: 13px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 8px; padding: 10px 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .warn { color: var(--warn); font-size: 12.5px; white-space: pre-wrap; font-family: var(--mono); }
  .note { color: var(--ink-3); font-size: 12.5px; margin-top: 8px; }
</style>
</head>
<body data-win="main">
<main>
  <h1 id="game-name">ZIL Player</h1>
  <div class="sub">Playing straight from Infocom's ZIL source. Switch the windows on and off here.</div>

  <div class="cards" id="cards"></div>
  <div class="row">
    <button id="open-all">Open all</button>
    <button id="close-all">Close all</button>
  </div>
  <div class="note">If the browser blocks the windows, allow pop-ups for this page.</div>

  <section>
    <h2>Now</h2>
    <div class="status">
      <span class="pill" id="state">…</span>
      <span id="where"></span>
      <span class="spacer"></span>
      <span id="score" class="muted"></span>
    </div>
  </section>

  <section>
    <h2>Game</h2>
    <div class="row" style="margin-top:0">
      <select id="games"></select>
      <label>Seed <input type="number" id="seed" style="width:80px" placeholder="random"></label>
      <button id="restart" class="primary">Start again</button>
    </div>
    <div class="note">The same seed gives the same random events every time (the walkthroughs use seed 1).</div>
    <div class="warn" id="warnings"></div>
  </section>
</main>
<div class="disconnected">Not connected to the server</div>

<script src="common.js"></script>
<script>
const WINDOWS = [
  { id: "game",   name: "Game",   what: "Play the game",                       url: "game.html",   w: 820,  h: 760 },
  { id: "source", name: "Source", what: "Source code, breakpoints, stepping",  url: "source.html", w: 1280, h: 860 },
  { id: "state",  name: "State",  what: "Variables, call stack, object tree",  url: "state.html",  w: 980,  h: 820 },
  { id: "map",    name: "Map",    what: "Rooms as you find them",              url: "map.html",   w: 1000, h: 760 },
];
const refs = {};          // window id -> Window we opened
const lastSeen = {};      // window id -> time of its last "alive" message
const boxes = {};

const cards = document.getElementById("cards");
let offset = 0;
for (const w of WINDOWS) {
  const box = el("input", { type: "checkbox" });
  boxes[w.id] = box;
  const card = el("div", { class: "card" },
    el("div", { class: "top" },
      el("span", { class: "name", text: w.name }),
      el("label", { class: "switch" }, box, el("span"))),
    el("div", { class: "what", text: w.what }));
  // Clicks on the switch itself toggle the checkbox (via its label) and fire "change";
  // clicks anywhere else on the card flip it here. Never both, or it opens and closes at once.
  card.addEventListener("click", (e) => {
    if (e.target.closest(".switch")) return;
    box.checked = !box.checked;
    toggle(w, box.checked);
  });
  box.addEventListener("change", () => toggle(w, box.checked));
  cards.append(card);
  w.x = 40 + offset; w.y = 40 + offset; offset += 30;
}

function isOpen(id) {
  if (refs[id] && !refs[id].closed) return true;
  return lastSeen[id] && Date.now() - lastSeen[id] < 5000;
}

function toggle(w, on) {
  if (on) {
    if (refs[w.id] && !refs[w.id].closed) { refs[w.id].focus(); return; }
    const feat = `width=${w.w},height=${w.h},left=${w.x},top=${w.y}`;
    refs[w.id] = window.open(w.url, "zil-" + w.id, feat);
    if (!refs[w.id]) { boxes[w.id].checked = false; alert("The browser blocked the window. Allow pop-ups for this page."); }
  } else {
    if (refs[w.id] && !refs[w.id].closed) refs[w.id].close();
    tell({ type: "close", win: w.id });     // for windows opened before a reload
    delete refs[w.id];
    delete lastSeen[w.id];
  }
}

document.getElementById("open-all").onclick = () => {
  for (const w of WINDOWS) { boxes[w.id].checked = true; toggle(w, true); }
};
document.getElementById("close-all").onclick = () => {
  for (const w of WINDOWS) { boxes[w.id].checked = false; toggle(w, false); }
};

onPeer("alive", (m) => { lastSeen[m.win] = Date.now(); });
onPeer("gone", (m) => { delete lastSeen[m.win]; setTimeout(syncBoxes, 300); });
function syncBoxes() {
  for (const w of WINDOWS) boxes[w.id].checked = !!isOpen(w.id);
}
setInterval(syncBoxes, 1000);
tell({ type: "ping" });

// Game status ---------------------------------------------------------------
const pill = document.getElementById("state");
async function refresh() {
  const info = await api("/api/info");
  document.getElementById("game-name").textContent = info.name;
  document.title = "ZIL Player: " + info.name;
  setPill(pill, info.state);
  const s = info.status || {};
  document.getElementById("where").textContent = s.left || "";
  document.getElementById("score").textContent = s.right || "";
  document.getElementById("warnings").textContent =
    info.warnings && info.warnings.length ? "Warnings from loading:\n" + info.warnings.join("\n") : "";
  if (info.seed !== null && info.seed !== undefined) document.getElementById("seed").value = info.seed;
  const g = await api("/api/games");
  const sel = document.getElementById("games");
  sel.innerHTML = "";
  for (const name of g.games) {
    const o = el("option", { value: name, text: name.replace(/\.zip$/, "") });
    if (name === g.current) o.selected = true;
    sel.append(o);
  }
}
on("input", (ev) => {
  setPill(pill, "input");
  document.getElementById("where").textContent = ev.status.left || "";
  document.getElementById("score").textContent = ev.status.right || "";
});
on("running", () => setPill(pill, "running"));
on("paused", (ev) => {
  setPill(pill, "paused");
  document.getElementById("where").textContent = "at " + locText(ev.loc);
});
on("ended", () => setPill(pill, "ended"));
on("error", () => setPill(pill, "error"));
on("restarted", refresh);

document.getElementById("restart").onclick = async () => {
  const seed = document.getElementById("seed").value;
  const game = document.getElementById("games").value;
  const r = await api("/api/restart", { seed: seed === "" ? null : Number(seed), game });
  if (r.error) alert("Could not start that game:\n" + r.error);
};

connect(refresh);
</script>
</body>
</html>
