<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIL Player</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="game.css">
<style>
  body { display: flex; height: 100vh; overflow: hidden; }
  .side {
    width: 270px; flex: none; display: flex; flex-direction: column; gap: 18px;
    padding: 14px; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line);
  }
  body.side-hidden .side { display: none; }
  .side h1 { font-size: 16px; margin: 0; }
  .side h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); margin: 0 0 6px; }
  .side .sub { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .wins { display: flex; flex-direction: column; gap: 2px; }
  .win {
    display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px;
    cursor: pointer; user-select: none;
  }
  .win:hover { background: var(--panel-2); }
  .win .txt { flex: 1; display: flex; flex-direction: column; }
  .win .name { font-weight: 600; font-size: 13.5px; }
  .win .what { color: var(--ink-3); font-size: 12px; }
  .switch { position: relative; width: 34px; height: 20px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .15s; }
  .switch span::after {
    content: ""; position: absolute; left: 3px; top: 3px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; transition: .15s;
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(14px); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
  .field select, .field input { width: 100%; }
  .note { color: var(--ink-3); font-size: 12px; }
  .now { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .now .mono { font-size: 12px; color: var(--ink-2); word-break: break-all; }
  .warn { color: var(--warn); font-size: 11.5px; white-space: pre-wrap; font-family: var(--mono); }
  #side-toggle {
    position: absolute; top: 4px; right: 8px; z-index: 2; padding: 1px 8px; font-size: 12px;
    background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent);
  }
  .play { position: relative; }
  .status { padding-right: 90px; }
  @media (max-width: 720px) {
    body { flex-direction: column; overflow: auto; height: auto; min-height: 100vh; }
    .play { height: 75vh; flex: none; }
    .side { width: auto; border-left: none; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body data-win="main">
<div class="play">
  <div class="status"><span id="left">&nbsp;</span><span id="right"></span></div>
  <button id="side-toggle" title="Show or hide the side panel">panel ▸</button>
  <div id="out"></div>
  <div class="inputrow">
    <span class="prompt">&gt;</span>
    <input id="line" autocomplete="off" spellcheck="false" autofocus>
    <span id="why"></span>
  </div>
</div>

<aside class="side">
  <div>
    <h1 id="game-name">ZIL Player</h1>
    <div class="sub">Played straight from Infocom's ZIL source</div>
  </div>

  <div>
    <h2>Windows</h2>
    <div class="wins" id="wins"></div>
    <div class="row" style="margin-top:6px">
      <button id="open-all">Open all</button>
      <button id="close-all">Close all</button>
    </div>
    <div class="note" style="margin-top:6px">If a window doesn't open, allow pop-ups for this page.</div>
  </div>

  <div>
    <h2>Now</h2>
    <div class="now">
      <div><span class="pill" id="state">…</span></div>
      <div class="mono" id="where"></div>
    </div>
  </div>

  <div>
    <h2>Game</h2>
    <div class="field">Story <select id="games"></select></div>
    <div class="field" style="margin-top:8px">Seed <input type="number" id="seed" placeholder="random"></div>
    <div class="row" style="margin-top:10px"><button id="restart" class="primary">Start again</button></div>
    <div class="note" style="margin-top:6px">The same seed gives the same random events every time (the walkthroughs use seed 1).</div>
    <div class="warn" id="warnings"></div>
  </div>
</aside>
<div class="disconnected">Not connected to the server</div>

<script src="common.js"></script>
<script src="game.js"></script>
<script>
const WINDOWS = [
  { id: "source", name: "Source", what: "Code, breakpoints, stepping",  url: "source.html", w: 1280, h: 860 },
  { id: "state",  name: "State",  what: "Variables, stack, objects",    url: "state.html",  w: 980,  h: 820 },
  { id: "map",    name: "Map",    what: "Rooms as you find them",       url: "map.html",    w: 1000, h: 760 },
];
const refs = {};          // window id -> Window we opened
const lastSeen = {};      // window id -> time of its last "alive" message
const boxes = {};

let offset = 0;
for (const w of WINDOWS) {
  const box = el("input", { type: "checkbox" });
  boxes[w.id] = box;
  const row = el("div", { class: "win" },
    el("div", { class: "txt" }, el("span", { class: "name", text: w.name }), el("span", { class: "what", text: w.what })),
    el("label", { class: "switch" }, box, el("span")));
  // Clicks on the switch toggle the checkbox (via its label) and fire "change";
  // clicks anywhere else on the row flip it here. Never both.
  row.addEventListener("click", (e) => {
    if (e.target.closest(".switch")) return;
    box.checked = !box.checked;
    toggle(w, box.checked);
  });
  box.addEventListener("change", () => toggle(w, box.checked));
  document.getElementById("wins").append(row);
  w.x = 60 + offset; w.y = 40 + offset; offset += 30;
}

function isOpen(id) {
  if (refs[id] && !refs[id].closed) return true;
  return lastSeen[id] && Date.now() - lastSeen[id] < 5000;
}

function toggle(w, on) {
  if (on) {
    if (refs[w.id] && !refs[w.id].closed) { refs[w.id].focus(); return; }
    const feat = `width=${w.w},height=${w.h},left=${w.x},top=${w.y}`;
    refs[w.id] = window.open(w.url, "zil-" + w.id, feat);
    if (!refs[w.id]) { boxes[w.id].checked = false; alert("The browser blocked the window. Allow pop-ups for this page."); }
  } else {
    if (refs[w.id] && !refs[w.id].closed) refs[w.id].close();
    tell({ type: "close", win: w.id });     // for windows opened before a reload
    delete refs[w.id];
    delete lastSeen[w.id];
  }
}

document.getElementById("open-all").onclick = () => {
  for (const w of WINDOWS) { boxes[w.id].checked = true; toggle(w, true); }
};
document.getElementById("close-all").onclick = () => {
  for (const w of WINDOWS) { boxes[w.id].checked = false; toggle(w, false); }
};

onPeer("alive", (m) => { lastSeen[m.win] = Date.now(); });
onPeer("gone", (m) => { delete lastSeen[m.win]; setTimeout(syncBoxes, 300); });
function syncBoxes() {
  for (const w of WINDOWS) boxes[w.id].checked = !!isOpen(w.id);
}
setInterval(syncBoxes, 1000);
tell({ type: "ping" });

// Side panel: show or hide (remembered) --------------------------------------
const sideBtn = document.getElementById("side-toggle");
function setSide(hidden) {
  document.body.classList.toggle("side-hidden", hidden);
  sideBtn.textContent = hidden ? "◂ panel" : "panel ▸";
  try { localStorage.setItem("zil-side-hidden", hidden ? "1" : ""); } catch (e) {}
}
sideBtn.onclick = () => setSide(!document.body.classList.contains("side-hidden"));
try { setSide(localStorage.getItem("zil-side-hidden") === "1"); } catch (e) {}

// Game status -------------------------------------------------------------------
const pill = document.getElementById("state");
const where = document.getElementById("where");
async function refresh() {
  const info = await api("/api/info");
  document.getElementById("game-name").textContent = info.name;
  document.title = "ZIL Player: " + info.name;
  setPill(pill, info.state);
  where.textContent = "";
  document.getElementById("warnings").textContent =
    info.warnings && info.warnings.length ? "Warnings from loading:\n" + info.warnings.join("\n") : "";
  if (info.seed !== null && info.seed !== undefined) document.getElementById("seed").value = info.seed;
  const g = await api("/api/games");
  const sel = document.getElementById("games");
  sel.innerHTML = "";
  for (const name of g.games) {
    const o = el("option", { value: name, text: name.replace(/\.zip$/, "") });
    if (name === g.current) o.selected = true;
    sel.append(o);
  }
}
on("input", () => { setPill(pill, "input"); where.textContent = ""; });
on("running", () => setPill(pill, "running"));
on("paused", (ev) => { setPill(pill, "paused"); where.textContent = ev.reason + " at " + locText(ev.loc); });
on("ended", () => setPill(pill, "ended"));
on("error", () => setPill(pill, "error"));
on("restarted", refresh);

document.getElementById("restart").onclick = async () => {
  const seed = document.getElementById("seed").value;
  const game = document.getElementById("games").value;
  const r = await api("/api/restart", { seed: seed === "" ? null : Number(seed), game });
  if (r.error) alert("Could not start that game:\n" + r.error);
};

connect(() => { refresh(); ZILGame.load(); });
</script>
</body>
</html>
